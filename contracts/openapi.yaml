openapi: 3.1.1
info:
  title: NexoEntrega 360 API
  version: 1.0.0
  description: >
    API de distribución comunitaria de kits. Contrato derivado de SPEC-1 a SPEC-5.
    Todas las rutas llevan el prefijo /api. Autenticación por sesión en servidor (cookie nexo_sid HttpOnly, SameSite=Lax; ADR-03).
    Errores con forma { error: { code, message, field? } }. 401 sin sesión; 403 acción prohibida sobre un recurso de su
    organización; 404 recurso inexistente o de otra organización; 409 conflicto de estado; 422 validación.
servers:
  - url: http://localhost:3000/api
security:
  - sesion: []
components:
  securitySchemes:
    sesion: { type: apiKey, in: cookie, name: nexo_sid }
  parameters:
    Codigo: { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Z]-\d{3,6}$' }, example: A-001 }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID. Se procesa después de autenticar y autorizar. Se guardan las respuestas 200 y 409 de negocio durante 24 h; 401, 403, 404, 422 y 5xx no se guardan y pueden reintentarse.
      schema: { type: string, format: uuid }
    CorrelationId: { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
  responses:
    E401: { description: Sin sesión válida, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E403: { description: Rol sin permiso sobre un recurso de su organización, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E404: { description: Inexistente o de otra organización, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E405: { description: El historial de auditoría no se edita ni se borra, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E409: { description: Transición o estado inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E422: { description: Validación; field indica el campo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, field: { type: string } }
    Estado: { type: string, enum: [BORRADOR, ENVIADA, RESERVADA, DESPACHADA, ENTREGADA, CANCELADA] }
    Zona: { type: string, enum: [NORTE, SUR, CENTRO, ORIENTE, OCCIDENTE] }
    Usuario:
      type: object
      properties: { id: { type: integer }, nombre: { type: string }, rol: { type: string, enum: [SOLICITANTE, COORDINADOR, BODEGA, AUDITOR] }, organizacion: { type: string } }
    SolicitudEntrada:
      type: object
      additionalProperties: false
      required: [zona, prioridad, fechaRequerida, lineas]
      properties:
        zona: { $ref: '#/components/schemas/Zona' }
        prioridad: { type: string, enum: [NORMAL, ALTA] }
        fechaRequerida: { type: string, format: date-time, description: Al enviar no puede ser anterior al momento del envío }
        observaciones: { type: [string, 'null'], maxLength: 500 }
        lineas:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [sku, cantidad]
            properties: { sku: { type: string }, cantidad: { type: integer, minimum: 1, maximum: 500 } }
    Solicitud:
      type: object
      properties:
        codigo: { type: string }
        organizacion: { type: string }
        solicitante: { type: object, properties: { id: { type: integer }, nombre: { type: string } } }
        zona: { $ref: '#/components/schemas/Zona' }
        prioridad: { type: string }
        fechaRequerida: { type: string, format: date-time }
        observaciones: { type: [string, 'null'] }
        estado: { $ref: '#/components/schemas/Estado' }
        lineas: { type: array, items: { type: object, properties: { sku: { type: string }, nombre: { type: string }, cantidad: { type: integer } } } }
        inventario:
          type: array
          description: Solo en transiciones que afectan inventario
          items: { type: object, properties: { sku: { type: string }, existenciaFisica: { type: integer }, reservada: { type: integer }, disponible: { type: integer } } }
    Pagina:
      type: object
      properties: { items: { type: array, items: {} }, page: { type: integer }, pageSize: { type: integer }, total: { type: integer } }
    Evento:
      type: object
      properties:
        id: { type: integer }
        actorId: { type: integer }
        organizacionId: { type: string }
        recurso: { type: string }
        recursoId: { type: string }
        accion: { type: string, enum: [ENVIAR, RESERVAR, DESPACHAR, ENTREGAR, CANCELAR, APROBAR_RESUMEN] }
        fechaUtc: { type: string, format: date-time }
        correlationId: { type: string }
    SalidaIA:
      description: Esquema del anexo ai-output.schema.json (apps/api/src/ai/schema.json). La salida del modelo es no confiable.
      $ref: '../apps/api/src/ai/schema.json'
    Resumen:
      type: object
      properties:
        id: { type: integer }
        etiqueta: { const: Asistencia de IA }
        estado: { type: string, enum: [BORRADOR, APROBADO] }
        origen: { type: string, enum: [IA, DETERMINISTA] }
        requestIds: { type: array, items: { type: string } }
        summary: { type: string, maxLength: 600 }
        recommendations: { type: array, maxItems: 5 }
        aviso: { type: [string, 'null'] }
paths:
  /auth/login:
    post:
      summary: Iniciar sesión (SPEC-1)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string, maxLength: 120 }, password: { type: string, minLength: 8, maxLength: 72 } } } } } }
      responses:
        '200': { description: Sesión creada (Set-Cookie nexo_sid), content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '422': { $ref: '#/components/responses/E422' }
  /auth/logout:
    post:
      summary: Cerrar sesión (SPEC-1)
      responses: { '204': { description: Sesión eliminada }, '401': { $ref: '#/components/responses/E401' } }
  /auth/me:
    get:
      summary: Usuario de la sesión (SPEC-1)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }, '401': { $ref: '#/components/responses/E401' } }
  /requests:
    get:
      summary: Listar solicitudes (SPEC-4). Solicitante solo las propias.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/Estado' } }
        - { name: prioridad, in: query, schema: { type: string, enum: [NORMAL, ALTA] } }
        - { name: zona, in: query, schema: { $ref: '#/components/schemas/Zona' } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pagina' } } } }, '401': { $ref: '#/components/responses/E401' }, '422': { $ref: '#/components/responses/E422' } }
    post:
      summary: Crear borrador (SPEC-2). Solo solicitante.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SolicitudEntrada' } } } }
      responses: { '201': { description: Creada en BORRADOR, content: { application/json: { schema: { $ref: '#/components/schemas/Solicitud' } } } }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '422': { $ref: '#/components/responses/E422' } }
  /requests/{id}:
    parameters: [{ $ref: '#/components/parameters/Codigo' }]
    get:
      summary: Detalle (SPEC-4)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Solicitud' } } } }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' } }
    put:
      summary: Editar borrador (SPEC-2). Solo el solicitante dueño y solo en BORRADOR.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SolicitudEntrada' } } } }
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' }, '409': { $ref: '#/components/responses/E409' }, '422': { $ref: '#/components/responses/E422' } }
  /requests/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/Codigo' }]
    post:
      summary: Enviar (SPEC-2). Cuerpo opcional con el contenido final; revalida contra el momento del envío.
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/SolicitudEntrada' } } } }
      responses: { '200': { description: ENVIADA }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' }, '409': { $ref: '#/components/responses/E409' }, '422': { $ref: '#/components/responses/E422' } }
  /requests/{id}/reserve:
    parameters: [{ $ref: '#/components/parameters/Codigo' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }]
    post:
      summary: Reservar todas las líneas o ninguna (SPEC-3). Solo coordinador; transaccional e idempotente.
      responses:
        '200': { description: RESERVADA. Repetición con la misma clave y contenido devuelve la misma respuesta con Idempotent-Replayed true., content: { application/json: { schema: { $ref: '#/components/schemas/Solicitud' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { description: 'STOCK_INSUFICIENTE, TRANSICION_INVALIDA o IDEMPOTENCIA_CONFLICTO (misma clave, otro contenido)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/E422' }
  /requests/{id}/dispatch:
    parameters: [{ $ref: '#/components/parameters/Codigo' }]
    post:
      summary: Despachar (SPEC-3). Solo bodega, desde RESERVADA.
      responses: { '200': { description: DESPACHADA }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' }, '409': { $ref: '#/components/responses/E409' } }
  /requests/{id}/deliver:
    parameters: [{ $ref: '#/components/parameters/Codigo' }]
    post:
      summary: Registrar entrega (SPEC-2). Solo coordinador, desde DESPACHADA.
      responses: { '200': { description: ENTREGADA }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' }, '409': { $ref: '#/components/responses/E409' } }
  /requests/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Codigo' }]
    post:
      summary: Cancelar (SPEC-2/3). Solo el solicitante dueño, desde ENVIADA o RESERVADA.
      responses: { '200': { description: CANCELADA }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' }, '409': { $ref: '#/components/responses/E409' } }
  /catalog:
    get:
      summary: SKU activos de la organización
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/E401' } }
  /dashboard:
    get:
      summary: Conteo por estado (SPEC-4). Solicitante solo las propias.
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/E401' } }
  /inventory:
    get:
      summary: Inventario de la organización (SPEC-3). Coordinador, bodega y auditor.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '422': { $ref: '#/components/responses/E422' } }
  /audit:
    get:
      summary: Historial de auditoría (SPEC-4). Solo auditor.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pagina' } } } }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '422': { $ref: '#/components/responses/E422' } }
  /audit/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put: { summary: No permitido, responses: { '405': { $ref: '#/components/responses/E405' } } }
    patch: { summary: No permitido, responses: { '405': { $ref: '#/components/responses/E405' } } }
    delete: { summary: No permitido, responses: { '405': { $ref: '#/components/responses/E405' } } }
  /ai/summaries:
    post:
      summary: Pedir un resumen asistido (SPEC-5). Solo coordinador; 1 a 20 solicitudes ENVIADA de su organización.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [requestIds], properties: { requestIds: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string } } } } } } }
      responses: { '201': { description: Borrador (origen IA o DETERMINISTA), content: { application/json: { schema: { $ref: '#/components/schemas/Resumen' } } } }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '422': { $ref: '#/components/responses/E422' } }
  /ai/summaries/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: Consultar un resumen (SPEC-5)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Resumen' } } } }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' } }
  /ai/summaries/{id}/approve:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: Aprobar (decisión humana; no cambia solicitudes ni inventario)
      responses: { '200': { description: APROBADO }, '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' }, '404': { $ref: '#/components/responses/E404' }, '409': { $ref: '#/components/responses/E409' } }
  /health:
    get:
      summary: Proceso vivo (RNF06)
      security: []
      responses: { '200': { description: ok } }
  /ready:
    get:
      summary: Base de datos accesible (RNF06)
      security: []
      responses: { '200': { description: ready }, '503': { description: not_ready } }
