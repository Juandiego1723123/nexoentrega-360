name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  verificacion:
    name: Specs, contrato y pruebas contra PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo_demo
          POSTGRES_DB: nexoentrega_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nexo:nexo_demo@localhost:5432/nexoentrega_test
      DATABASE_URL: postgres://nexo:nexo_demo@localhost:5432/nexoentrega_test
      SEED_PASSWORD: NexoDemo2026!
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # El check compara spec.json con su fuente SIN regenerarlo antes.
      - name: SPECS (fuente única vs JSON)
        run: npm run specs:check
      - name: Contrato OpenAPI vs rutas
        run: npm run contract:check
      - name: Trazabilidad AC → prueba
        run: npm run trace:check
      - name: Migración y seed
        run: npm run migrate && npm run seed
      - name: Pruebas unitarias y de integración (base real)
        run: npm test
      - name: Compilar interfaz
        run: npm run build
      - name: Instalar navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (1366 y 390 px)
        run: npm run test:e2e
      - name: Prueba de humo del arranque
        run: |
          LOG_SILENT=true node apps/api/src/server.js &
          sleep 2
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/api/ready
      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.sha }}
          path: |
            evidence/tests/e2e-results.json
            evidence/screenshots/
          if-no-files-found: ignore
